name: Windows build and installer

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-windows.lock
      - name: Check version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'A tag deve corresponder à versão do aplicativo.'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "APP_VERSION=$version"
      - name: Install pinned build dependencies
        run: |
          python -m pip install -r packaging/requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw 'Falha nas dependências.' }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { throw 'Falha na instalação do projeto.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependências incompatíveis.' }
      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $compilerDir = Join-Path $env:RUNNER_TEMP 'innosetup'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $p = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', ('/DIR="{0}"' -f $compilerDir)) -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Falha na instalação do compilador.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ISCC_PATH=$compilerDir\ISCC.exe"
      - name: Build and exercise frozen application
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Iscc $env:ISCC_PATH
      - name: Test installation and uninstallation
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Installer "dist/WebEngineerRAG-Setup-$env:APP_VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/WebEngineerRAG-Setup-*.exe
            dist/WebEngineerRAG-Setup-*.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME "dist/WebEngineerRAG-Setup-$env:APP_VERSION.exe" "dist/WebEngineerRAG-Setup-$env:APP_VERSION.exe.sha256" --verify-tag --generate-notes --title "Web Engineer RAG $env:APP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release.' }
